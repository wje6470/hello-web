<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-7-3 · 詳解</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2em; }
    .items { display: flex; gap: 16px; margin-bottom: 1em; }
    .item {
      width: 100px; height: 100px;
      display: grid; place-items: center;
      border: 2px solid #d1d5db; border-radius: 50%;
      font-size: 1.2rem;
      /* 1. transition: 顏色與位移的變化都變滑順 */
      transition: background .3s ease, transform .3s ease;
    }
    .item.active {
      background: gold; font-weight: bold;
      /* 3. 中選的那顆抖一下 */
      animation: shake .4s ease;
    }

    /* 2. keyframes: 用 rotate 做左右抖動 */
    @keyframes shake {
      from { transform: rotate(0deg); }
      25%  { transform: rotate(-8deg); }
      75%  { transform: rotate(8deg); }
      to   { transform: rotate(0deg); }
    }

    /* 「點擊後短暫洗牌再定住」需要 setTimeout（Day 2 才教）, 留給行有餘力的人自由發揮 */
  </style>
</head>
<body>
  <div class="items">
    <div class="items"></div>
  </div>
  <button id="pick">吃什麼？</button>

  <script>
    const foods = ["便當","漢堡","三明治","牛肉麵","拉麵"];
    const container = document.querySelector(".items");

    for (const food of foods) {
      const div = document.createElement("div");
      div.className = "item";
      div.textContent = food;
      container.appendChild(div);
    }

    const button = document.querySelector("#pick");

    button.addEventListener("click", function () {

      // 清掉全部高亮
      const items = document.querySelectorAll(".item");
      items.forEach(function(item){
          item.classList.remove("active");
      });
      const timer = setInterval(function (){
        // 隨機挑一個
        const index = Math.floor(Math.random() * foods.length);
        // 點亮中選項目
        items[index].classList.add("active");
      },100)

      setTimeout(function () {
        clearInterval(timer);
        items.forEach(function(item){
          item.classList.remove("active");
        });

        const index = Math.floor(Math.random() * items.length);
        items[index].classList.add("active");

      }, 1000);
  });
  </script>
</body>
</html>
